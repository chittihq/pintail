[workspace]
members = [
    "crates/pintail",
    "crates/pintail-api",
    "crates/pintail-backup",
    "crates/pintail-catalog",
    "crates/pintail-cdc",
    "crates/pintail-exec",
    "crates/pintail-log",
    "crates/pintail-meta",
    "crates/pintail-poll",
    "crates/pintail-probe",
    "crates/pintail-protocol",
    "crates/pintail-snapshot",
    "crates/pintail-sql",
    "crates/pintail-store",
    "crates/pintail-telemetry",
    "crates/pintail-types",
    "crates/pintail-wire",
    "tests/sqllogic",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/pintail-db/pintail"
# 1.88 because time 0.3.47, taken for CVE-2026-25727, requires it. The
# resolver is MSRV-aware, so leaving this at 1.85 would silently hold the
# workspace on the vulnerable 0.3.45 the next time the lockfile is regenerated.
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1.0.98"
argon2 = "0.5.3"
async-trait = "0.1.91"
axum = { version = "0.8.4", features = ["ws"] }
bytes = "1.10.1"
chacha20poly1305 = "0.11.0"
chrono = { version = "0.4.41", default-features = false, features = ["clock"] }
chrono-tz = { version = "0.10", features = ["case-insensitive"] }
clap = { version = "4.5.40", features = ["derive", "env"] }
crc32fast = "1.5.0"
fs2 = "0.4.3"
futures-util = "0.3.31"
icu_collator = "=2.1.2"
http-body-util = "0.1.3"
jsonwebtoken = { version = "=10.3.0", default-features = false, features = ["rust_crypto"] }
lz4_flex = "0.11.5"
mime_guess = "2.0.5"
md-5 = "0.10.6"
mysql_async = { version = "0.37.0", default-features = false, features = ["binlog", "minimal-rust", "rustls-tls", "ring"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# 0.26 rather than 0.25: 0.25 pulls rustls 0.22, whose rustls-webpki 0.102
# carries a high-severity panic on a malformed CRL BIT STRING. 0.26 shares the
# rustls 0.23 the rest of the workspace already uses, so the fix also collapses
# two copies of rustls into one.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls-pemfile = "2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.13"
unicode-normalization = "0.1"
unicode-casefold = "0.2"
object_store = { version = "0.14.1", default-features = false, features = ["aws"] }
pintail-api = { path = "crates/pintail-api" }
pintail-backup = { path = "crates/pintail-backup" }
pintail-catalog = { path = "crates/pintail-catalog" }
pintail-cdc = { path = "crates/pintail-cdc" }
pintail-exec = { path = "crates/pintail-exec" }
pintail-log = { path = "crates/pintail-log" }
pintail-meta = { path = "crates/pintail-meta" }
pintail-poll = { path = "crates/pintail-poll" }
pintail-probe = { path = "crates/pintail-probe" }
pintail-protocol = { path = "crates/pintail-protocol" }
pintail-snapshot = { path = "crates/pintail-snapshot" }
pintail-store = { path = "crates/pintail-store" }
pintail-telemetry = { path = "crates/pintail-telemetry" }
pintail-sql = { path = "crates/pintail-sql" }
pintail-types = { path = "crates/pintail-types" }
pintail-wire = { path = "crates/pintail-wire" }
rand = "0.9.1"
rand_core06 = { package = "rand_core", version = "0.6.4", features = ["getrandom"] }
rsa = "0.9.8"
rayon = "1.10.0"
rusqlite = { version = "0.37.0", features = ["bundled"] }
rust-embed = { version = "8.7.2", features = ["compression"] }
serde = { version = "1.0.219", features = ["derive"] }
regex = "1.11"
serde_json = "1.0.140"
sha2 = "0.11.0"
sha1 = "0.10.6"
sqlparser = { version = "0.62.0", features = ["visitor"] }
tempfile = "3.20.0"
thiserror = "2.0.12"
tokio = { version = "1.45.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.9.2"
tower = { version = "0.5.2", features = ["util"] }
xxhash-rust = { version = "0.8.15", features = ["xxh3"] }
zstd = "0.13.3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

# Dev builds skip full debug info: the target directory lives on a slow
# external volume (see ~/.local/bin/cargo), and line tables keep backtraces
# usable at roughly half the artifact size and link time.
[profile.dev]
debug = "line-tables-only"
lto = "off"

[profile.test]
debug = "line-tables-only"
lto = "off"
