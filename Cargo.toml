[workspace]
members = [
    "crates/pintail",
    "crates/pintail-api",
    "crates/pintail-backup",
    "crates/pintail-catalog",
    "crates/pintail-cdc",
    "crates/pintail-exec",
    "crates/pintail-meta",
    "crates/pintail-poll",
    "crates/pintail-probe",
    "crates/pintail-snapshot",
    "crates/pintail-sql",
    "crates/pintail-store",
    "crates/pintail-types",
    "crates/pintail-wire",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/pintail-db/pintail"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1.0.98"
axum = "0.8.4"
chrono = { version = "0.4.41", default-features = false, features = ["clock"] }
clap = { version = "4.5.40", features = ["derive", "env"] }
fs2 = "0.4.3"
http-body-util = "0.1.3"
lz4_flex = "0.11.5"
mime_guess = "2.0.5"
pintail-api = { path = "crates/pintail-api" }
pintail-catalog = { path = "crates/pintail-catalog" }
pintail-exec = { path = "crates/pintail-exec" }
pintail-meta = { path = "crates/pintail-meta" }
pintail-store = { path = "crates/pintail-store" }
pintail-sql = { path = "crates/pintail-sql" }
pintail-types = { path = "crates/pintail-types" }
rand = "0.9.1"
rusqlite = { version = "0.37.0", features = ["bundled"] }
rust-embed = { version = "8.7.2", features = ["compression"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sqlparser = "0.62.0"
tempfile = "3.20.0"
tokio = { version = "1.45.1", features = ["macros", "net", "rt-multi-thread", "signal"] }
toml = "0.9.2"
tower = { version = "0.5.2", features = ["util"] }
xxhash-rust = { version = "0.8.15", features = ["xxh3"] }
zstd = "0.13.3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
