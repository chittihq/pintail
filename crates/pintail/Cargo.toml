[package]
name = "pintail"
description = "A single-binary columnar analytical database for MySQL"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# Serves the tokio task view on 127.0.0.1:6669 for `tokio-console`.
#
# Off by default and never in a shipped binary: it needs
# `RUSTFLAGS="--cfg tokio_unstable"`, which changes tokio's ABI, and it
# opens a port that answers questions about the process to anyone who can
# reach it. Build it deliberately, look, and throw the binary away:
#
#   RUSTFLAGS="--cfg tokio_unstable" cargo run --features console
#   tokio-console
console = ["dep:console-subscriber"]
failpoints = [
    "pintail-api/failpoints",
    "pintail-cdc/failpoints",
    "pintail-poll/failpoints",
    "pintail-snapshot/failpoints",
    "pintail-store/failpoints",
    "pintail-meta/failpoints",
]

[dependencies]
pintail-cdc.workspace = true
pintail-poll.workspace = true
pintail-snapshot.workspace = true
pintail-store.workspace = true
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
fs2.workspace = true
pintail-api.workspace = true
pintail-exec.workspace = true
pintail-meta.workspace = true
pintail-log.workspace = true
pintail-telemetry.workspace = true
pintail-wire.workspace = true
rand.workspace = true
rustix.workspace = true
serde.workspace = true
tokio.workspace = true
console-subscriber = { version = "0.4", optional = true }
toml.workspace = true
tikv-jemallocator.workspace = true

[dev-dependencies]
rusqlite.workspace = true
tempfile.workspace = true

[lints]
workspace = true
