[package]
name = "pintail-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[workspace]
members = ["."]

[features]
libfuzzer = ["dep:libfuzzer-sys"]

[dependencies]
libfuzzer-sys = { version = "0.4", optional = true }
pintail-protocol = { path = "../crates/pintail-protocol" }
pintail-store = { path = "../crates/pintail-store", features = ["fuzzing"] }
pintail-cdc = { path = "../crates/pintail-cdc" }
mysql_async = { version = "=0.37.1", default-features = false, features = ["binlog", "minimal-rust", "rustls-tls", "ring"] }
tempfile = "3.20.0"
tokio = { version = "1.45.1", features = ["rt", "io-util"] }

[[bin]]
name = "wire"
path = "fuzz_targets/wire.rs"
test = false
doc = false
bench = false
required-features = ["libfuzzer"]

[[bin]]
name = "binlog"
path = "fuzz_targets/binlog.rs"
test = false
doc = false
bench = false
required-features = ["libfuzzer"]

[[bin]]
name = "storage"
path = "fuzz_targets/storage.rs"
test = false
doc = false
bench = false
required-features = ["libfuzzer"]

# The published `mysql_common` panics on a corrupted transaction-payload
# header: both `TryFrom<u64>` impls narrow an unrecognised value to `u8`
# with `unwrap()` before putting it in the error that reports it, so a
# value above 255 aborts on exactly the input the error exists for. The
# panic is unreachable from our own code - `mysql_async` decodes those
# events inside its stream, before an event reaches us - so a guard on our
# side cannot prevent it. Pinned to a fork carrying that fix until it lands
# upstream; 0.38 still has both unwraps.
[patch.crates-io]
mysql_common = { git = "https://github.com/chittihq/rust_mysql_common", rev = "74369dbd353fb20d4f7537055e922a92c525a275" }
