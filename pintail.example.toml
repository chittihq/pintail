data_dir = "./data"
# Hard disk ceiling shared by all concurrent query spill (8 GiB).
global_spill_limit_bytes = 8589934592

[http]
bind = "127.0.0.1:8080"

[wire]
bind = "127.0.0.1:3306"
# Close authenticated connections after 15 minutes without a command.
idle_timeout_seconds = 900
# Connections accepted at once, authenticated or not; beyond this a client
# gets MySQL's "Too many connections" (1040). Zero disables the bound.
max_connections = 1000
# Prepared statements one session may hold open; beyond this a PREPARE is
# refused with MySQL's 1461. Zero disables the bound.
max_prepared_statements = 1024

[query]
# Hard memory ceiling shared by HTTP and MySQL wire queries (64 MiB).
memory_limit_bytes = 67108864
# Hard spill-disk ceiling for one query (1 GiB).
spill_limit_bytes = 1073741824
