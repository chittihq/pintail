# Production deployment: pulls the published image instead of building.
#
# `docker-compose.dev.yml` alongside this file builds from source, which is
# right for development and wrong for a server - it would compile the whole
# Rust workspace and the dashboard on the deploy host on every release. This
# file runs the exact image the release workflow built, and is the one
# `docker compose up` picks by default.
#
#   docker compose up -d                                   # production
#   docker compose -f docker-compose.dev.yml up -d --build # local build
#
# Or point Dokploy at this repository as a Docker Compose service. The image
# is public, so no registry credential is required.

services:
  pintail:
    image: ghcr.io/chittihq/pintail:${PINTAIL_VERSION:-0.0.1-rc4}
    ports:
      # The dashboard and HTTP query API. Put a TLS terminator in front of
      # this: the dashboard is a control plane, not a security boundary.
      - "${PINTAIL_HTTP_PORT:-8080}:8080"
      # The MySQL wire endpoint. 3306 collides with a MySQL server on the
      # same host; remap the left-hand side if one is present.
      - "${PINTAIL_WIRE_PORT:-3306}:3306"
    environment:
      PINTAIL_DATA_DIR: /var/lib/pintail
      # Spill defaults under the data directory, so it shares that mount
      # unless PINTAIL_SPILL_DATA below points it elsewhere.
      PINTAIL_SPILL_DIR: /var/lib/pintail/spill
      # Set this explicitly under a container memory limit.
      #
      # The default is three quarters of host memory read from
      # /proc/meminfo, and inside a container that reports the HOST's RAM
      # rather than the cgroup limit. On a 64GB host with a 4GB container
      # cap the default computes ~48GB, so the budget never engages and the
      # kernel OOM killer decides instead. Set it to roughly 75% of the
      # limit configured in `deploy.resources` below.
      PINTAIL_TOTAL_QUERY_MEMORY_LIMIT_BYTES: ${PINTAIL_TOTAL_QUERY_MEMORY_LIMIT_BYTES:-3221225472}
    volumes:
      # The replica, the metadata store, the first-boot secrets, and - unless
      # a separate spill mount is added below - spill.
      - ${PINTAIL_DATA:-pintail-data}:/var/lib/pintail
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 2s
      retries: 12
      # Startup reopens every table snapshot, so a real replica needs longer
      # than the 2s a development stack does.
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # Keep this and PINTAIL_TOTAL_QUERY_MEMORY_LIMIT_BYTES in step: the
          # query budget bounds operator memory, not the whole resident set,
          # so leave the container headroom above it.
          memory: ${PINTAIL_MEMORY_LIMIT:-4G}

# Storage defaults to Docker-managed named volumes, which is the right choice
# when the host has one disk and nothing else wants a say.
#
# To relocate it, set either of these to an ABSOLUTE host path - no edits to
# this file required, so the setting survives redeploys on platforms that
# re-clone the repo (e.g. Dokploy):
#
#   PINTAIL_DATA=/mnt/your_volume/pintail/data          # the big one
#
# Spill lives inside that mount by default. To put it on faster storage, add
# a second mount and point the server at it:
#
#   volumes:
#     - /mnt/fast_disk/pintail/spill:/var/lib/pintail/spill
#
# A bind path needs the same chown as below. Note that images before
# 0.0.1-rc5 do not contain /var/lib/pintail/spill, so mounting a fresh NAMED
# volume there against those gets a root-owned directory the server cannot
# write to - use a chowned bind path, or an image from rc5 onwards.
#
# Compose treats a value starting with "/" as a bind mount and anything else
# as a named volume, so leaving a variable unset keeps the default exactly.
# Set only the ones you care about - relocating just the replica is a valid
# setup.
#
# Docker creates missing bind directories automatically, owned by root.
# Pintail runs as uid 10001 and does not fix its own ownership, so prepare a
# bind path before first boot or it cannot write and startup fails:
#
#   sudo mkdir -p /mnt/your_volume/pintail/data
#   sudo chown -R 10001:10001 /mnt/your_volume/pintail/data
#
# Size the spill mount against `global_spill_limit_bytes` (8GB by default) on
# top of whatever the replica needs, or a large sort fails on disk before it
# fails on its own limit.
#
# Docker will not repoint a volume that already holds data: stop the stack and
# remove the old named volumes, copying their contents across first if you
# want to keep them. Losing the data volume means every encrypted source DSN
# becomes unreadable and every table needs a resnapshot, so copy rather than
# recreate.
volumes:
  pintail-data:
