# End-to-end differential gate on GitHub-hosted runners (issue #5 follow-up).
#
# Everything runs on the runner's own Docker — no external hosts, no
# secrets. Pushes and PRs get a three-phase smoke; the nightly cron and
# manual dispatch run all eight phases.

name: E2E

on:
  push:
    branches: [dev, main]
  pull_request:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keyed by event so a dispatched or scheduled full gate never cancels
  # (or gets cancelled by) the push-triggered smoke on the same branch.
  group: e2e-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: Swatinem/rust-cache@v2
      - name: Dashboard assets
        run: |
          cd packages/dashboard
          bun install --frozen-lockfile
          bun run generate
      - run: bun install --frozen-lockfile
        working-directory: tests/e2e
      - name: E2E smoke (snapshot, crud, ddl)
        run: E2E_PHASES=snapshot,crud,ddl bun run e2e
        working-directory: tests/e2e
        env:
          PINTAIL_DASHBOARD_PREBUILT: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-smoke-results
          path: |
            tests/e2e/results-partial.md
            tests/e2e/results-partial.json

  full:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: Swatinem/rust-cache@v2
      - name: Dashboard assets
        run: |
          cd packages/dashboard
          bun install --frozen-lockfile
          bun run generate
      - run: bun install --frozen-lockfile
        working-directory: tests/e2e
      - name: E2E full gate (all eight phases)
        run: bun run e2e
        working-directory: tests/e2e
        env:
          PINTAIL_DASHBOARD_PREBUILT: '1'
      - name: Summary
        if: always()
        run: |
          if [ -f tests/e2e/results.md ]; then
            cat tests/e2e/results.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-full-results
          path: |
            tests/e2e/results.md
            tests/e2e/results.json

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: Swatinem/rust-cache@v2
      - name: Dashboard assets
        run: |
          cd packages/dashboard
          bun install --frozen-lockfile
          bun run generate
      - name: Browser dependencies
        run: |
          cd tests/browser
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium
      - name: Browser smoke (dashboard walkthrough)
        run: bun run smoke
        working-directory: tests/browser
        env:
          PINTAIL_DASHBOARD_PREBUILT: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-smoke-screenshots
          path: tests/browser/artifacts/
