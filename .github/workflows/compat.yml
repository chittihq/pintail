# Nightly compatibility matrix on GitHub-hosted runners (issue #5 follow-up).
#
# Runs the Docker-gated integration suites that `cargo test` skips by
# default: CDC against MySQL 8.4 (GTID, file position, MINIMAL row
# metadata) and MariaDB 11, snapshot + polling sources, the control-plane
# API suite, MinIO backup restore, and the wire-protocol client matrix.
# Everything uses the runner's own Docker — no external hosts, no secrets.

name: Compat

on:
  schedule:
    - cron: '45 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compat-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suites:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: cdc
            command: cargo test -p pintail-cdc --test mysql_cdc -- --ignored --nocapture --test-threads=1
          - suite: snapshot
            command: cargo test -p pintail-snapshot --test mysql_snapshot -- --ignored --nocapture
          - suite: poll
            command: cargo test -p pintail-poll --test mysql_poll -- --ignored --nocapture
          - suite: api
            command: cargo test -p pintail-api --test mysql_api -- --ignored --nocapture --test-threads=1
          - suite: backup
            command: cargo test -p pintail-backup --test minio_restore -- --ignored --nocapture
          - suite: wire
            command: cargo test -p pintail-wire --test wire_compat -- --nocapture
    name: ${{ matrix.suite }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: Swatinem/rust-cache@v2
        with:
          key: compat-${{ matrix.suite }}
      - name: Dashboard assets
        run: |
          cd packages/dashboard
          bun install --frozen-lockfile
          bun run generate
      - name: MySQL client and wire dependencies
        if: matrix.suite == 'wire'
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-client
          cd tests/integration/wire-clients
          bun install --frozen-lockfile
      - uses: astral-sh/setup-uv@v5
        if: matrix.suite == 'wire'
      - uses: actions/setup-go@v5
        if: matrix.suite == 'wire'
        with:
          go-version-file: tests/integration/wire-clients/go.mod
          cache-dependency-path: tests/integration/wire-clients/go.sum
      - name: Run suite
        run: ${{ matrix.command }}
        env:
          PINTAIL_DASHBOARD_PREBUILT: '1'
          PINTAIL_EXTERNAL_WIRE_CLIENTS: ${{ matrix.suite == 'wire' && '1' || '' }}
          PINTAIL_MYSQL_CLI: ${{ matrix.suite == 'wire' && '/usr/bin/mysql' || '' }}
