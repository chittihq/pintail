name: Release

# Publishes the single-binary container to the GitHub Container Registry when
# a version tag is pushed.
#
# The binary is profile-guided for each platform's generic target: the
# Dockerfile builds it instrumented, trains it on benchmark/pgo-train.ts (no
# source server needed) and rebuilds it with the profile, inside the image
# build. That adds an instrumented build and a training run to each
# architecture's job (docs/release-builds.md has the cost).
#
# Each architecture builds on its own native runner and the results are joined
# into one manifest. The obvious alternative — one job emitting both platforms —
# runs linux/arm64 under QEMU on an x86 runner, which is instruction-level
# emulation and 5-20x slower: the first attempt at this spent 49 minutes still
# inside the build step. Native runners also let the two architectures compile
# at the same time instead of one after the other.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version to publish, e.g. 0.0.1-rc1"
        required: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.derive.outputs.version }}
      prerelease: ${{ steps.derive.outputs.prerelease }}
    steps:
      - id: derive
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            version="${{ github.event.inputs.tag }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # A pre-release must not claim `latest`: anything carrying a hyphen
          # after the patch number (-rc1, -beta.2) is one.
          case "$version" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Sign in to the registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          # The Dockerfile's default, stated here so the release does not
          # depend on it.
          build-args: |
            PINTAIL_PGO=1
          # Push anonymously by digest; the merge job below names them.
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # Registry cache, not GitHub Actions cache. Measured on
          # v0.0.1-rc3: exporting to the GHA cache took 235s and the build
          # had ZERO cache hits. mode=max writes multi-gigabyte Rust layers
          # for each platform against a 10GB shared cap, so the two scopes
          # evict each other between runs - 235s spent writing a cache that
          # never pays. The registry is the one already being pushed to and
          # has no such cap, so the cooked-dependency layer survives.
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE }}:buildcache-${{ strategy.job-index }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE }}:buildcache-${{ strategy.job-index }},mode=max,image-manifest=true

      # Each architecture's image is checked on its own native runner, before
      # the manifest names it: the server's startup line must say it is the
      # profile-guided build for the generic target.
      - name: Prove this architecture's binary is the profile-guided build
        run: |
          set -euo pipefail
          image="${REGISTRY}/${IMAGE}@${DIGEST}"
          docker run --detach --name pintail-variant "$image" \
            --data-dir /var/lib/pintail --http-bind 127.0.0.1:8080 >/dev/null
          line=''
          for _ in $(seq 1 60); do
            line=$(docker logs pintail-variant 2>&1 | grep -m1 'pintail optimizations:' || true)
            [ -n "$line" ] && break
            sleep 2
          done
          docker rm --force pintail-variant >/dev/null
          echo "${line#*pintail optimizations: }"
          case "$line" in
            *"build_target=generic build_variant=pgo "*) ;;
            *) echo "the image does not report build_target=generic build_variant=pgo" >&2; exit 1 ;;
          esac
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: Record the digest
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*
          retention-days: 1

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - name: Sign in to the registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Join the per-architecture builds into one manifest
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          tags="--tag ${REGISTRY}/${IMAGE}:${VERSION}"
          if [ "${PRERELEASE}" = "false" ]; then
            tags="$tags --tag ${REGISTRY}/${IMAGE}:latest"
          fi
          # shellcheck disable=SC2046
          docker buildx imagetools create $tags \
            $(printf "${REGISTRY}/${IMAGE}@sha256:%s " *)
        env:
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}

      - name: Prove the published image starts and answers
        run: |
          set -euo pipefail
          image="${REGISTRY}/${IMAGE}:${{ needs.version.outputs.version }}"
          docker run --detach --name pintail-smoke --publish 8080:8080 \
            "$image" --data-dir /var/lib/pintail --http-bind 0.0.0.0:8080
          # A first boot mints its own secrets and prints them, and this log is
          # public. The container is thrown away seconds later so the values are
          # worthless, but publishing anything shaped like a key teaches the
          # wrong habit and invites someone to reuse one. Redact on both paths.
          redacted() { docker logs pintail-smoke 2>&1 | sed -E 's/^(PINTAIL_[A-Z_]+=).*/\1<redacted>/'; }
          for _ in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/health >/dev/null; then
              echo "health check passed"
              redacted | tail -5
              docker rm --force pintail-smoke
              exit 0
            fi
            sleep 2
          done
          echo "published image never became healthy" >&2
          redacted >&2
          docker rm --force pintail-smoke
          exit 1

      - name: Summary
        run: |
          {
            echo "### Published"
            echo
            echo '```'
            echo "docker pull ${REGISTRY}/${IMAGE}:${{ needs.version.outputs.version }}"
            echo '```'
            echo
            echo "Architectures: linux/amd64, linux/arm64 (each built natively, profile-guided for the generic target)"
            echo "Pre-release: ${{ needs.version.outputs.prerelease }} (a pre-release does not move \`latest\`)"
          } >> "$GITHUB_STEP_SUMMARY"
