name: Executor instruction gate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  instructions:
    runs-on: ubuntu-latest
    container: rust:1.97.1-bookworm
    env:
      RUSTUP_TOOLCHAIN: 1.97.1
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # The job runs as root inside the container while the workspace is
      # owned by the runner, so git refuses the checkout as dubious and
      # `git rev-parse HEAD` (the recorder's provenance) exits 128.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: apt-get update && apt-get install --yes --no-install-recommends valgrind python3
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --release -p pintail-exec --example instruction_workload
      - run: python3 -m unittest discover -s benchmark/instructions -p 'test_*.py'
      - run: python3 benchmark/instructions/run.py --binary target/release/examples/instruction_workload --output validate-out/instructions.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instruction-counts
          path: validate-out/instructions.json
