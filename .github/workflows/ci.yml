name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      # Keep in lockstep with rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: bun install --frozen-lockfile
        working-directory: packages/dashboard
      - run: bun run typecheck
        working-directory: packages/dashboard
      - run: bun run generate
        working-directory: packages/dashboard
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
        env:
          PINTAIL_DASHBOARD_PREBUILT: "1"
      - run: cargo nextest run --workspace --locked
        env:
          PINTAIL_DASHBOARD_PREBUILT: "1"
      - name: Differential coverage evidence checks
        run: bun test scripts/differential-coverage.test.ts
      - name: Local parser corpus (known upstream binlog reproducer is explicitly ignored)
        run: cargo test --manifest-path fuzz/Cargo.toml --locked
