# Production-shaped benchmark tiers (issue #5).
#
# All jobs need the remote docker host: set repository variable
# BENCHMARK_DOCKER_SSH (e.g. "user@bench-host") and secret
# BENCHMARK_SSH_KEY (private key authorized on that host). Jobs skip
# cleanly when the variable is unset, so forks stay green.

name: Production benchmark

on:
  push:
    branches: [dev, main]
    tags: ['v*']
  schedule:
    - cron: '0 2 * * *' # nightly: mixed CDC + restart phases
  workflow_dispatch:
    inputs:
      profile:
        description: 'workload profile'
        default: 'ci'

permissions:
  contents: read

concurrency:
  group: production-bench
  cancel-in-progress: false # benchmark runs must not be killed mid-measurement

jobs:
  # Runner-local production acceptance: the correctness regression net.
  # Runs on the GitHub runner's own Docker with the public ci dataset —
  # no external host, no secrets — so it works on every fork. Exactness
  # is the signal here; timing comparisons stay on the dedicated host.
  acceptance:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
        working-directory: benchmark
      - name: Production acceptance (ci profile, runner-local docker)
        run: >
          bun run run-production.ts --profile ci --dataset ci
          --phases snapshot,cold --engines mysql,pintail
        working-directory: benchmark
      - name: Publish summary
        if: always()
        run: |
          if [ -f benchmark/workloads/commerce-production-v1/results/latest.md ]; then
            cat benchmark/workloads/commerce-production-v1/results/latest.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-acceptance-results
          path: benchmark/workloads/commerce-production-v1/results/

  ci-profile:
    if: github.event_name == 'push' && vars.BENCHMARK_DOCKER_SSH != ''
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Connect docker context
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.BENCHMARK_SSH_KEY }}" > ~/.ssh/bench_key
          chmod 600 ~/.ssh/bench_key
          echo -e "Host bench\n  HostName ${BENCHMARK_HOST#*@}\n  User ${BENCHMARK_HOST%@*}\n  IdentityFile ~/.ssh/bench_key\n  StrictHostKeyChecking accept-new" >> ~/.ssh/config
          docker context create bench --docker "host=ssh://bench"
          docker context use bench
          # Bound every call: a wedged SSH link otherwise hangs until the job
          # timeout instead of failing as the host-health problem it is.
          timeout 60 docker version --format '{{.Server.Version}}' \
            || { echo "::error::docker host unreachable or wedged"; exit 1; }
          free_gb=$(timeout 60 ssh -o BatchMode=yes bench "df -kP / | tail -1 | awk '{print \$4}'")
          free_gb=$(( free_gb / 1024 / 1024 ))
          echo "docker host free space: ${free_gb}GB"
          if [ "$free_gb" -lt 15 ]; then
            # Reclaim only what this repository generates. Named volumes and
            # other projects' state are never touched.
            echo "below 15GB, pruning build cache and dangling images"
            timeout 300 docker builder prune -f || true
            timeout 300 docker image prune -f || true
          fi
          docker info --format '{{.Name}} {{.NCPU}}cpu'
        env:
          BENCHMARK_HOST: ${{ vars.BENCHMARK_DOCKER_SSH }}
      - name: Reuse the downloaded dataset between runs
        uses: actions/cache@v4
        with:
          path: benchmark/.dataset-cache
          key: dataset-${{ runner.os }}-${{ hashFiles('benchmark/workloads/commerce-production-v1/dataset-manifest.json') }}
          restore-keys: dataset-${{ runner.os }}-
      - run: bun install --frozen-lockfile
        working-directory: benchmark
      - name: Dataset provenance (warn-only)
        run: bun run verify-dataset-provenance.ts
        working-directory: benchmark
      - name: Run ci profile (dataset-loaded, snapshot/cold/warm)
        run: bun run run-production.ts --profile ci --dataset ci --phases snapshot,cold,warm
        working-directory: benchmark
      - name: Publish summary
        if: always()
        run: |
          if [ -f benchmark/workloads/commerce-production-v1/results/latest.md ]; then
            cat benchmark/workloads/commerce-production-v1/results/latest.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-ci-results
          path: benchmark/workloads/commerce-production-v1/results/

      - name: Remove this run's containers
        if: always()
        run: |
          # Only the prefixes this repository creates. The host is shared and
          # carries a deployed stack; nothing outside these names is in scope.
          for prefix in pintail-e2e- pintail-browser- pintail-m9-bench- pintail-m4- pintail-prod- pintail-mysql-oracle-; do
            ids=$(timeout 60 docker ps -aq --filter "name=^${prefix}" 2>/dev/null || true)
            if [ -n "$ids" ]; then timeout 120 docker rm -f $ids || true; fi
          done

  nightly:
    if: github.event_name == 'schedule' && vars.BENCHMARK_DOCKER_SSH != ''
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Connect docker context
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.BENCHMARK_SSH_KEY }}" > ~/.ssh/bench_key
          chmod 600 ~/.ssh/bench_key
          echo -e "Host bench\n  HostName ${BENCHMARK_HOST#*@}\n  User ${BENCHMARK_HOST%@*}\n  IdentityFile ~/.ssh/bench_key\n  StrictHostKeyChecking accept-new" >> ~/.ssh/config
          docker context create bench --docker "host=ssh://bench"
          docker context use bench
          # Bound every call: a wedged SSH link otherwise hangs until the job
          # timeout instead of failing as the host-health problem it is.
          timeout 60 docker version --format '{{.Server.Version}}' \
            || { echo "::error::docker host unreachable or wedged"; exit 1; }
          free_gb=$(timeout 60 ssh -o BatchMode=yes bench "df -kP / | tail -1 | awk '{print \$4}'")
          free_gb=$(( free_gb / 1024 / 1024 ))
          echo "docker host free space: ${free_gb}GB"
          if [ "$free_gb" -lt 15 ]; then
            # Reclaim only what this repository generates. Named volumes and
            # other projects' state are never touched.
            echo "below 15GB, pruning build cache and dangling images"
            timeout 300 docker builder prune -f || true
            timeout 300 docker image prune -f || true
          fi
        env:
          BENCHMARK_HOST: ${{ vars.BENCHMARK_DOCKER_SSH }}
      - name: Reuse the downloaded dataset between runs
        uses: actions/cache@v4
        with:
          path: benchmark/.dataset-cache
          key: dataset-${{ runner.os }}-${{ hashFiles('benchmark/workloads/commerce-production-v1/dataset-manifest.json') }}
          restore-keys: dataset-${{ runner.os }}-
      - run: bun install --frozen-lockfile
        working-directory: benchmark
      - name: Run ci profile with mixed CDC + restart phases
        run: bun run run-production.ts --profile ci --dataset ci
        working-directory: benchmark
      - name: Publish summary
        if: always()
        run: |
          if [ -f benchmark/workloads/commerce-production-v1/results/latest.md ]; then
            cat benchmark/workloads/commerce-production-v1/results/latest.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-nightly-results
          path: benchmark/workloads/commerce-production-v1/results/

      - name: Remove this run's containers
        if: always()
        run: |
          # Only the prefixes this repository creates. The host is shared and
          # carries a deployed stack; nothing outside these names is in scope.
          for prefix in pintail-e2e- pintail-browser- pintail-m9-bench- pintail-m4- pintail-prod- pintail-mysql-oracle-; do
            ids=$(timeout 60 docker ps -aq --filter "name=^${prefix}" 2>/dev/null || true)
            if [ -n "$ids" ]; then timeout 120 docker rm -f $ids || true; fi
          done

  release-gate:
    if: startsWith(github.ref, 'refs/tags/v') && vars.BENCHMARK_DOCKER_SSH != ''
    runs-on: ubuntu-latest
    timeout-minutes: 600
    # The only job that writes to the repository, and only the results
    # ledgers for the tag it is measuring.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # A tag checkout is detached; the commit below needs a branch.
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Connect docker context
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.BENCHMARK_SSH_KEY }}" > ~/.ssh/bench_key
          chmod 600 ~/.ssh/bench_key
          echo -e "Host bench\n  HostName ${BENCHMARK_HOST#*@}\n  User ${BENCHMARK_HOST%@*}\n  IdentityFile ~/.ssh/bench_key\n  StrictHostKeyChecking accept-new" >> ~/.ssh/config
          docker context create bench --docker "host=ssh://bench"
          docker context use bench
          # Bound every call: a wedged SSH link otherwise hangs until the job
          # timeout instead of failing as the host-health problem it is.
          timeout 60 docker version --format '{{.Server.Version}}' \
            || { echo "::error::docker host unreachable or wedged"; exit 1; }
          free_gb=$(timeout 60 ssh -o BatchMode=yes bench "df -kP / | tail -1 | awk '{print \$4}'")
          free_gb=$(( free_gb / 1024 / 1024 ))
          echo "docker host free space: ${free_gb}GB"
          if [ "$free_gb" -lt 15 ]; then
            # Reclaim only what this repository generates. Named volumes and
            # other projects' state are never touched.
            echo "below 15GB, pruning build cache and dangling images"
            timeout 300 docker builder prune -f || true
            timeout 300 docker image prune -f || true
          fi
        env:
          BENCHMARK_HOST: ${{ vars.BENCHMARK_DOCKER_SSH }}
      - name: Reuse the downloaded dataset between runs
        uses: actions/cache@v4
        with:
          path: benchmark/.dataset-cache
          key: dataset-${{ runner.os }}-${{ hashFiles('benchmark/workloads/commerce-production-v1/dataset-manifest.json') }}
          restore-keys: dataset-${{ runner.os }}-
      - run: bun install --frozen-lockfile
        working-directory: benchmark
      - name: Engine microbenchmark (20M, four-engine fairness table)
        run: bun run run.ts
        working-directory: benchmark
      - name: Check out the dataset store
        uses: actions/checkout@v4
        with:
          repository: chittihq/pintail-ds
          path: pintail-ds
          token: ${{ secrets.DATASET_STORE_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Publish the full dataset if it does not exist yet
        run: |
          # publish-dataset.ts writes aliases[profileName], so the release
          # alias is simply `full`. Generating it takes hours, which is the
          # whole reason it is published once and loaded thereafter.
          alias_file="$DS_REPO/datasets/commerce-production-v1/aliases.json"
          if [ -f "$alias_file" ] && grep -q '"full"' "$alias_file"; then
            echo "release dataset already published; loading it"
          else
            echo "no full alias on the dataset store; generating and publishing"
            bun run publish-dataset.ts --profile full --store release --ds-repo "$DS_REPO"
          fi
        working-directory: benchmark
        env:
          DS_REPO: ${{ github.workspace }}/pintail-ds
      - name: Full production workload
        run: bun run run-production.ts --profile full --dataset full
        working-directory: benchmark
      - name: Publish summary
        if: always()
        run: |
          for f in benchmark/results.md benchmark/workloads/commerce-production-v1/results/latest.md; do
            [ -f "$f" ] && cat "$f" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Commit the results against the tag
        if: success()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmark/results.json benchmark/results.md \
                  benchmark/workloads/commerce-production-v1/results/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no result changes to record"
            exit 0
          fi
          git commit -m "bench: full-profile results for ${GITHUB_REF_NAME}"
          # Another release could have landed while this ran; rebase rather
          # than force, so a concurrent result is never discarded.
          git pull --rebase origin "${DEFAULT_BRANCH}"
          git push origin "HEAD:${DEFAULT_BRANCH}"
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-gate-results
          path: |
            benchmark/results.json
            benchmark/results.md
            benchmark/workloads/commerce-production-v1/results/

      - name: Remove this run's containers
        if: always()
        run: |
          # Only the prefixes this repository creates. The host is shared and
          # carries a deployed stack; nothing outside these names is in scope.
          for prefix in pintail-e2e- pintail-browser- pintail-m9-bench- pintail-m4- pintail-prod- pintail-mysql-oracle-; do
            ids=$(timeout 60 docker ps -aq --filter "name=^${prefix}" 2>/dev/null || true)
            if [ -n "$ids" ]; then timeout 120 docker rm -f $ids || true; fi
          done